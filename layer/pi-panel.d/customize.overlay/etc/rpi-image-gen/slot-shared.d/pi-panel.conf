Version=1
# Accounts and hostname set on the device (first-boot provisioning, passwd,
# hostnamectl) survive reboots and updates. All four account files go
# together. sysusers.d/pi-panel.conf re-adds the service user if needed.
EarlyPersistFile=/etc/passwd
EarlyPersistFile=/etc/shadow
EarlyPersistFile=/etc/group
EarlyPersistFile=/etc/gshadow
EarlyPersistFile=/etc/hostname
# Already shared by their own layers: /etc/ssh (host keys), /var/lib/iwd
# (wifi), the machine ID. /persistent/pi-panel is on the persistent partition.
